name: tests core 13

# Every "runTests.sh" call below passes "-b docker". The script prefers podman
# whenever it is present, but rootless podman on the GitHub hosted runners
# cannot resolve the name of the database container, and its crun aborts
# container starts at random ("crun: unknown version specified"). Docker
# resolves the names and avoids crun. The flag is written into every step
# instead of a matrix entry, because a matrix value would become part of the
# job names the required status checks refer to.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-quality:
    name: "code quality with core v13"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2' ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Prepare dependencies for TYPO3 v13"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run PHP lint"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s lintPhp"

      - name: "Run TypoScript lint"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s lintTypoScript"

      - name: "Validate CGL"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s cgl -n"

      - name: "Ensure tests methods do not start with \"test\""
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s checkTestMethodsPrefix"

      - name: "Ensure UTF-8 files do not contain BOM"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s checkBom"

      - name: "Test .rst files for integrity"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s checkRst"

      - name: "Find duplicate exception codes"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s checkExceptionCodes"

      - name: "Run PHPStan"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s phpstan"

      - name: "Render documentation"
        run: "Build/Scripts/runTests.sh -b docker -s renderDocumentation -- --fail-on-log"

  unit:
    name: "unit tests with core v13 (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.5' ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Prepare dependencies for TYPO3 v13"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run unit tests"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s unit"

  functional:
    name: "functional tests with core v13 (PHP ${{ matrix.php-version }}, ${{ matrix.dbms }})"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.5' ]
        dbms: [ 'sqlite', 'mariadb', 'mysql', 'postgres' ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Prepare dependencies for TYPO3 v13"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run functional tests"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -d ${{ matrix.dbms }} -s functional"

  acceptance:
    name: "acceptance tests with core v13 (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.5' ]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Prepare dependencies for TYPO3 v13"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s composerUpdate"

      - name: "Run acceptance tests"
        run: "Build/Scripts/runTests.sh -b docker -t 13 -p ${{ matrix.php-version }} -s acceptance"

      - name: "Upload the acceptance report"
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-report-core13-php${{ matrix.php-version }}
          path: .Build/acceptance/
          retention-days: 7
